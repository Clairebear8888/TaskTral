<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chromeless Window</title>
    <style>
      body {
        margin: 0;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        height: 100vh;
        font-family: Arial, sans-serif;
        color: white;
        border-radius: 10px;
      }
      #title-bar {
        padding: 10px;
        background: rgba(0, 0, 0, 0.5);
        -webkit-app-region: drag;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      #content {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }
      #progress-container {
        width: 80%;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 20px;
      }
      #progress-bar {
        height: 20px;
        width: 0;
        background: #4caf50;
        transition: width 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="title-bar">
      <h3 id="category-text" style="margin: 0">Loading...</h3>
    </div>
    <div id="content">
      <h2 id="status-text">Loading...</h2>
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>
    <script src="chromeless-renderer.js"></script>
  </body>
</html>
